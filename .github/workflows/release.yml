name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger so the maintainer can dry-run the workflow without
  # cutting a tag (artifacts are uploaded to the workflow run, not the
  # release).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach binaries to (leave empty for workflow-only build)'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'
  # Both binaries practitioners install:
  BINARIES: 'wafrift wafrift-proxy'

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux/aarch64 only)
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }} -p wafrift-cli -p wafrift-proxy

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }} -p wafrift-cli -p wafrift-proxy

      - name: Stage release artefacts
        shell: bash
        run: |
          set -euo pipefail
          stage="wafrift-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$stage"
          # The wafrift-cli crate produces a binary named `wafrift`.
          for bin in wafrift wafrift-proxy; do
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp "target/${{ matrix.target }}/release/${bin}.exe" "$stage/"
            else
              cp "target/${{ matrix.target }}/release/${bin}" "$stage/"
            fi
          done
          cp README.md LICENSE-MIT LICENSE-APACHE 2>/dev/null "$stage/" || true
          cp CHANGELOG.md "$stage/" || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${stage}.zip" "$stage"
            echo "ASSET=${stage}.zip" >> $GITHUB_ENV
          else
            tar czf "${stage}.tar.gz" "$stage"
            echo "ASSET=${stage}.tar.gz" >> $GITHUB_ENV
          fi

      - name: SHA-256 checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi
          cat "${ASSET}.sha256"

      - name: Upload as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # crates.io publication for the same tag. Trusted Publishing exchanges this
  # job's OIDC identity for a short-lived upload token, so no registry secret
  # lives in the repository. The binaries must build before anything is
  # published, because a published version can only be yanked, never replaced.
  crates:
    name: publish crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prove the tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -B - <<'PY'
          import pathlib
          import tomllib

          document = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          print(document["workspace"]["package"]["version"])
          PY
          )"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi

      - name: Authenticate to crates.io via Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates.io packages
        run: bash scripts/publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
